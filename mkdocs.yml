site_name: Trait-bound Julia
site_description: A design for traits in Julia, built as a patched compiler and a package
site_url: https://traitjuliaprototype.github.io/julia-trait-bound/
repo_url: https://github.com/TraitJuliaPrototype/julia-trait-bound
repo_name: TraitJuliaPrototype/julia-trait-bound
edit_uri: ""
docs_dir: site-src
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - tables
  - admonition
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
  anchors: ignore
  links:
    not_found: ignore

nav:
  - Home: README.md
  - The references:
      - Overview and conventions: writeup/reference/README.md
      - Traits: writeup/reference/traits.md
      - The facts mode: writeup/reference/facts.md
      - Compiler and runtime: writeup/reference/compiler.md
      - Lowering: writeup/reference/lowering.md
  - For programmers:
      - Traits for Julia: writeup/intro/traits-for-julia.md
      - Traits by example: writeup/intro/traits-by-example.md
      - The trait language reference: writeup/reference/traits.md
      - Results: writeup/intro/results.md
      - Glossary: writeup/glossary.md
  - For core developers:
      - The state of the prototype: writeup/state.md
      - The rationale: writeup/design.md
      - The argument in detail: writeup/design/argument.md
      - Evidence: writeup/design/evidence.md
      - Performance: writeup/design/performance.md
      - Changes to Julia, the inventory: writeup/design/julia-changes.md
      - Comparison with other languages: writeup/design/comparison.md
      - Other languages, the research: writeup/other-languages.md
      - Alternatives considered: writeup/design/alternatives.md
      - Open issues: writeup/open-issues.md
      - Porting to traits: writeup/intro/porting.md
      - Glossary: writeup/glossary.md
  - The record, for agents:
      - Index: writeup/record/INDEX.md
      - Decision log: writeup/record/decisions.md
      - Writeup overview: writeup/README.md
      - Proofs, wrapping by facts: writeup/explorations/wrapping-by-facts.md
      - Strict mode: writeup/explorations/strict-mode.md
      - Findings log: writeup/design-findings.md
      - Design history: writeup/record/design-history.md
      - Retired, the implementation in detail: writeup/design/implementation.md
      - Retired, the mechanisms: writeup/design/mechanisms.md
      - Environment and workflow: session-notes/00-environment-and-workflow.md
